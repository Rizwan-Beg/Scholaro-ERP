# ============================================================
# Scholaro ERP — Application Configuration
# ============================================================

# ----- Server -----
server.port=8080

# ----- MySQL Datasource -----
spring.datasource.url=jdbc:mysql://localhost:3306/scholaro_erp?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234567890
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ----- JPA / Hibernate -----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ----- JWT Configuration -----
# IMPORTANT: Change this secret in production! Use a strong 256-bit key.
app.jwt.secret=ScHoLaRoErP2024SecretKeyForJWTAuthenticationModuleXyz!@#
app.jwt.expiration-ms=86400000

# ----- Logging -----
logging.level.com.scholaro.erp=DEBUG
logging.level.org.springframework.security=DEBUG
